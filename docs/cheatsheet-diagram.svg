<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <style>
    .bg { fill: #f7f9fc }
    .box { fill: #ffffff; stroke: #2b6cb0; stroke-width:2; rx:8; ry:8 }
    .center { fill:#fff9e6; stroke:#d69e2e; stroke-width:3 }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:16px; fill:#1a202c }
    .title { font-size:18px; font-weight:700 }
    .small { font-size:12px; fill:#4a5568 }
    .arrow { stroke: #4a5568; stroke-width:2; fill:none; marker-end: url(#arrowhead) }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="700"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" class="title text">GitHub Capabilities — One-page Diagram</text>
  <text x="500" y="58" text-anchor="middle" class="small">Digital_Library_GitHub — visual map of how features relate</text>

  <!-- Center repo box -->
  <g transform="translate(300,120)">
    <rect class="center" x="160" y="60" width="320" height="110" rx="10" ry="10"/>
    <text x="320" y="110" text-anchor="middle" class="text" style="font-size:20px; font-weight:700;">Repository (📁)</text>
    <text x="320" y="135" text-anchor="middle" class="small">Files, branches, commits — source of truth</text>
  </g>

  <!-- Top row -->
  <g>
    <rect class="box" x="70" y="140" width="180" height="70" rx="8" ry="8"/>
    <text x="160" y="175" class="text">Issues (📝)</text>
    <text x="160" y="194" class="small">Tasks, bugs, ideas</text>

    <rect class="box" x="400" y="20" width="200" height="70" rx="8" ry="8"/>
    <text x="500" y="55" class="text">Pull Requests 🔀</text>
    <text x="500" y="74" class="small">Review + merge branches</text>

    <rect class="box" x="760" y="140" width="180" height="70" rx="8" ry="8"/>
    <text x="850" y="175" class="text">Projects (📋)</text>
    <text x="850" y="194" class="small">Boards & tables</text>
  </g>

  <!-- Bottom row -->
  <g>
    <rect class="box" x="70" y="380" width="220" height="90" rx="8" ry="8"/>
    <text x="180" y="420" class="text">Codespaces (💻)</text>
    <text x="180" y="439" class="small">Cloud dev environment</text>

    <rect class="box" x="365" y="430" width="270" height="90" rx="8" ry="8"/>
    <text x="500" y="470" class="text">Copilot (🤖)</text>
    <text x="500" y="489" class="small">Inline AI suggestions</text>

    <rect class="box" x="720" y="380" width="220" height="90" rx="8" ry="8"/>
    <text x="830" y="420" class="text">Actions (⚙️)</text>
    <text x="830" y="439" class="small">Automations / CI</text>
  </g>

  <!-- Arrows to center -->
  <path class="arrow" d="M210,175 L240,175 L240,115"/>
  <path class="arrow" d="M360,90 L400,160"/>
  <path class="arrow" d="M790,175 L760,175 L760,115"/>

  <path class="arrow" d="M200,420 L300,210"/>
  <path class="arrow" d="M500,520 L500,230"/>
  <path class="arrow" d="M800,420 L640,230"/>

  <!-- Lines connecting top/middle to center box (positioning) -->
  <path class="arrow" d="M250,175 L320,175"/>
  <path class="arrow" d="M500,90 L500,170"/>
  <path class="arrow" d="M760,175 L640,175"/>

  <!-- Connect bottom to center -->
  <path class="arrow" d="M200,420 L320,240"/>
  <path class="arrow" d="M500,520 L500,240"/>
  <path class="arrow" d="M800,420 L640,240"/>

  <!-- Small legend box -->
  <rect x="30" y="570" width="940" height="110" fill="#ffffff" stroke="#cbd5e0" rx="8" ry="8"/>
  <text x="60" y="598" class="text" style="font-weight:700">Legend & short workflows</text>
  <text x="60" y="618" class="small">• Create Issue → create branch → edit files → open PR → merge → (Project card moves to Done)</text>
  <text x="60" y="635" class="small">• Codespaces + Copilot = fast editing & suggestions (review before commit)</text>
  <text x="60" y="652" class="small">• Actions runs checks on commits/PRs. Pages publishes docs/site.</text>

</svg>
